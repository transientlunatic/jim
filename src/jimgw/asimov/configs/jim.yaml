{%- if production.event.repository -%}
{%- assign repo_dir = production.event.repository.directory -%}
{%- else -%}
{%- assign repo_dir = "." -%}
{%- endif -%}
{%- assign meta = production.meta -%}
{%- assign data = production.meta['data'] -%}
{%- assign ifos = production.meta['interferometers'] -%}

# Jim Configuration File
# Generated by asimov for {{ production.name }}

# Working directory
working_dir: {{ production.rundir }}/results

# Random seed
seed: {{ meta['sampler']['seed'] | default: 0 }}

# Event parameters
gps: {{ production.meta['event time'] }}
segment_length: {{ data['segment length'] }}
post_trigger_length: {{ data['post trigger time'] | default: 2.0 }}

# Frequency settings
f_min: {{ meta['quality']['minimum frequency'][ifos[0]] }}
f_max: {{ meta['quality']['maximum frequency'][ifos[0]] }}
f_ref: {{ meta['likelihood']['reference frequency'] | default: 20.0 }}

# Detectors
ifos:
{%- for ifo in ifos %}
  - {{ ifo }}
{%- endfor %}

{%- if data contains "data files" %}
{%- if data['data files'].size > 0 %}
# Data files (GWF frame files)
data_files:
{%- for ifo in ifos %}
  {{ ifo }}: {{ data['data files'][ifo] }}
{%- endfor %}

# Channel names for frame files
channels:
{%- for ifo in ifos %}
  {{ ifo }}: {{ data['channels'][ifo] }}
{%- endfor %}
{%- endif %}
{%- endif %}

{%- if production._previous_assets() contains "psds" %}
# PSDs from previous analysis
psd_files:
{%- for ifo in ifos %}
  {{ ifo }}: {{ production._previous_assets()['psds'][ifo] }}
{%- endfor %}
{%- elsif production.meta contains "psds" %}
# PSDs from configuration
psd_files:
{%- for ifo in ifos %}
  {{ ifo }}: {{ production.meta['psds'][ifo] }}
{%- endfor %}
{%- endif %}

# Sampler settings
n_chains: {{ meta['sampler']['n chains'] | default: 500 }}
n_local_steps: {{ meta['sampler']['n local steps'] | default: 100 }}
n_global_steps: {{ meta['sampler']['n global steps'] | default: 1000 }}
n_training_loops: {{ meta['sampler']['n training loops'] | default: 20 }}
n_production_loops: {{ meta['sampler']['n production loops'] | default: 10 }}
n_epochs: {{ meta['sampler']['n epochs'] | default: 20 }}
mala_step_size: {{ meta['sampler']['mala step size'] | default: 0.002 }}
rq_spline_hidden_units:
  - {{ meta['sampler']['rq spline hidden units'][0] | default: 128 }}
  - {{ meta['sampler']['rq spline hidden units'][1] | default: 128 }}
rq_spline_n_bins: {{ meta['sampler']['rq spline n bins'] | default: 10 }}
rq_spline_n_layers: {{ meta['sampler']['rq spline n layers'] | default: 8 }}
learning_rate: {{ meta['sampler']['learning rate'] | default: 0.001 }}
batch_size: {{ meta['sampler']['batch size'] | default: 10000 }}
n_max_examples: {{ meta['sampler']['n max examples'] | default: 30000 }}
n_NFproposal_batch_size: {{ meta['sampler']['n NFproposal batch size'] | default: 100 }}
local_thinning: {{ meta['sampler']['local thinning'] | default: 1 }}
global_thinning: {{ meta['sampler']['global thinning'] | default: 100 }}
history_window: {{ meta['sampler']['history window'] | default: 200 }}
n_temperatures: {{ meta['sampler']['n temperatures'] | default: 0 }}
max_temperature: {{ meta['sampler']['max temperature'] | default: 20.0 }}
n_tempered_steps: {{ meta['sampler']['n tempered steps'] | default: 10 }}

# Run definition
definition_name: IMRPhenomPv2StandardCBC

# Prior ranges
{%- if meta contains 'priors' %}
{%- assign priors = meta['priors'] -%}
M_c_range:
  - {{ priors['chirp mass']['minimum'] | default: 10.0 }}
  - {{ priors['chirp mass']['maximum'] | default: 80.0 }}
q_range:
  - {{ priors['mass ratio']['minimum'] | default: 0.125 }}
  - {{ priors['mass ratio']['maximum'] | default: 1.0 }}
max_s1: {{ priors['spin 1']['maximum'] | default: 0.99 }}
max_s2: {{ priors['spin 2']['maximum'] | default: 0.99 }}
iota_range:
  - 0.0
  - 3.141592653589793
dL_range:
  - {{ priors['luminosity distance']['minimum'] | default: 1.0 }}
  - {{ priors['luminosity distance']['maximum'] | default: 2000.0 }}
t_c_range:
  - {{ priors['geocentric time']['minimum'] | default: -0.05 }}
  - {{ priors['geocentric time']['maximum'] | default: 0.05 }}
{%- else %}
# Default prior ranges
M_c_range:
  - 10.0
  - 80.0
q_range:
  - 0.125
  - 1.0
max_s1: 0.99
max_s2: 0.99
iota_range:
  - 0.0
  - 3.141592653589793
dL_range:
  - 1.0
  - 2000.0
t_c_range:
  - -0.05
  - 0.05
{%- endif %}
phase_c_range:
  - 0.0
  - 6.283185307179586
psi_range:
  - 0.0
  - 3.141592653589793
ra_range:
  - 0.0
  - 6.283185307179586
dec_range:
  - -1.5707963267948966
  - 1.5707963267948966
